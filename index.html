<body>
<canvas id="game"></canvas>
<div id="loading"><img id="ldLogo" alt="Ograaa"><div id="ldWrap"><div id="ldBar"></div></div><div id="tapGo" class="disp" data-t="tapStart"></div><div class="cred" data-t="credit"></div></div>
<div id="menu" class="off">
 <header id="top">

 </header>
 <nav id="side"></nav>
 <main id="main">
  <section class="screen" id="s-home"></section><section class="screen" id="s-routes"></section><section class="screen" id="s-garage"></section><section class="screen" id="s-showroom"></section>
  <section class="screen" id="s-traffic"></section><section class="screen" id="s-profile"></section><section class="screen" id="s-settings"></section>
 </main>
</div>
<div id="hud">
 <div id="hudTop">
  <button id="pauseBtn">⏸</button>
  <div id="trackBox"><div id="trackHdr"><b id="nextName"></b><span id="nextDist" class="gold"></span></div><div id="track"></div></div>
  <div class="chips"><div class="chip" id="cMoney"></div><div class="chip" id="cPax"></div><div class="chip" id="cCargo"></div><div class="chip" id="cTemp"></div><div class="chip" id="cClock"></div><div class="chip" id="limitChip"><b id="limitV">60</b></div></div>
 </div>
 <div id="prompt"><span>⛽</span><span id="promptTxt"></span></div>
 <button id="startBtn"></button>
 <div id="dash"><canvas id="fuelG"></canvas><canvas id="cluster"></canvas><canvas id="tempG"></canvas></div>
 <div class="pedal" id="pedB"></div><div class="pedal" id="pedG"></div>
 <div id="ctrlsL"></div><div id="ctrls"></div>
 <div class="pan" id="radioP"><div class="lcd" id="radioLCD" style="left:24.5%;right:28.5%;top:25%;bottom:60%"></div><button class="hot" id="rPow" style="left:4.8%;top:27%;width:13.7%;height:46%;border-radius:50%"></button><button class="hot rpre" style="left:20.6%;top:66%;width:12.2%;height:15%"></button><button class="hot rpre" style="left:33.2%;top:66%;width:12.2%;height:15%"></button><button class="hot rpre" style="left:46.1%;top:66%;width:12.2%;height:15%"></button><button class="hot rpre" style="left:59%;top:66%;width:12.2%;height:15%"></button><button class="hot" id="rNext" style="left:75%;top:23%;width:5%;height:31%"></button><button class="hot" id="rPrev" style="left:75%;top:56%;width:5%;height:31%"></button><button class="hot" id="rVolD" style="left:83%;top:33%;width:6%;height:41%;border-radius:50% 0 0 50%"></button><button class="hot" id="rVolU" style="left:89%;top:33%;width:6%;height:41%;border-radius:0 50% 50% 0"></button></div>
 <div class="pan" id="acP"><div class="lcd" id="acLCD" style="left:30.5%;right:31.5%;top:15%;bottom:54%"></div><button class="hot" id="acCool" style="left:4%;top:10%;width:11%;height:80%;border-radius:50% 0 0 50%"></button><button class="hot" id="acWarm" style="left:15%;top:10%;width:11%;height:80%;border-radius:0 50% 50% 0"></button><button class="hot" id="fanDn" style="left:73%;top:10%;width:11.5%;height:80%;border-radius:50% 0 0 50%"></button><button class="hot" id="fanUp" style="left:84.5%;top:10%;width:11.5%;height:80%;border-radius:0 50% 50% 0"></button><button class="hot sq" id="acOn" style="left:28.1%;top:62%;width:9.5%;height:31%"></button><button class="hot sq" id="acRec" style="left:37.9%;top:62%;width:10.5%;height:31%"></button><button class="hot sq" id="acVent" style="left:48.9%;top:62%;width:10.8%;height:31%"></button><button class="hot sq" id="acDef" style="left:60.1%;top:62%;width:10.8%;height:31%"></button></div>
 <div class="pan" id="cruiseP"><button class="hot sq" id="ccOn" style="left:16%;top:9.5%;width:37%;height:38%"></button><button class="hot sq" id="ccRes" style="left:55%;top:9.5%;width:36%;height:38%"></button><button class="hot sq" id="ccSet" style="left:16%;top:50%;width:37%;height:42%"></button><button class="hot sq" id="ccCan" style="left:55%;top:50%;width:36%;height:42%"></button></div>
</div>
<div id="fatigue"></div>
<div id="toasts"></div>
<div class="modal" id="restM"><div class="mbox"><h2><span data-t="restTitle"></span> · <span id="restName"></span></h2><p class="muted" data-t="rest1"></p><div class="row" style="justify-content:center"><span class="disp gold" style="font-size:2rem" id="restT"></span></div><div class="ropts" id="restOpts"></div><div class="mbtns"><button class="btn sec" id="rCall" data-t="callBack"></button><button class="btn" id="rLeave" data-t="leave"></button></div></div></div>
<div class="modal" id="recM"><div class="mbox" id="recBox"></div></div>
<div class="modal" id="pauseM"><div class="mbox"><h2 data-t="pause"></h2><div class="mbtns" style="flex-direction:column"><button class="btn" id="pResume" data-t="resume"></button><button class="btn sec" id="pRestart" data-t="restart"></button><button class="btn sec" id="pHelp" data-t="help"></button><button class="btn red" id="pQuit" data-t="quit"></button></div></div></div>
<div class="modal" id="crashM"><div class="mbox"><h2 id="crashT"></h2></div></div>
<div class="modal" id="helpM"><div class="mbox" style="text-align:start"><h2 data-t="help" style="text-align:center"></h2><p data-t="help1"></p><p data-t="help2"></p><p data-t="help3"></p><p class="muted" style="direction:ltr;text-align:left">⌨ →/W gas · ←/S brake · D door · H horn · Q/E indicators · Z hazard · L lights · B belt · G gear · C cruise · X cancel · R radio · A A/C · V wipers · Space handbrake · P pause</p><div class="mbtns"><button class="btn" id="helpOk" data-t="gotIt"></button></div></div></div>
<div class="modal" id="confirmM"><div class="mbox"><h2 id="cfT"></h2><div class="mbtns"><button class="btn red" id="cfYes">OK</button><button class="btn sec" id="cfNo">✕</button></div></div></div>
<div id="rotate"><div style="font-size:3rem">📱↻</div><div class="disp" style="font-size:1.4rem">لف الموبايل بالعرض · Rotate to landscape</div><button class="btn sm sec" onclick="this.parentNode.classList.remove('req')">OK</button></div>
<script>
/* load guard: if a game file is missing or loading fails, say so instead of hanging */
window.__ogErr=[];addEventListener('error',function(e){var t=e.target;if(t&&(t.src||t.href)){__ogErr.push('missing: '+(t.src||t.href).split('/').slice(-2).join('/'));}else{__ogErr.push(String(e.message||e));}},true);
setTimeout(function(){if(window.G&&G.mode)return;var b=document.createElement('div');b.style.cssText='position:fixed;left:50%;top:62%;transform:translateX(-50%);max-width:90vw;padding:14px 18px;border-radius:12px;background:#2a0e14;border:1px solid #ff5a6e;color:#ffd7dc;font:600 14px system-ui;text-align:center;z-index:999';
var t=document.createElement('div');t.textContent='The game did not finish loading';b.appendChild(t);var d=document.createElement('small');d.style.opacity='.8';d.textContent=__ogErr.slice(0,4).join(' | ')||'timeout';b.appendChild(d);
var r=document.createElement('button');r.textContent='Reload';r.style.cssText='display:block;margin:8px auto 0;padding:6px 14px;border-radius:8px;border:0;background:#f5b21b;font-weight:800;cursor:pointer';r.onclick=function(){location.reload();};b.appendChild(r);document.body.appendChild(b);},20000);
</script>
