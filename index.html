:root{--bg:#070b14;--g1:rgba(22,32,56,.86);--g2:rgba(8,12,22,.92);--line:rgba(140,190,255,.16);--line2:rgba(140,190,255,.3);--amb:#ffb627;--amb2:#ffd98a;--cy:#2ee6ff;--ok:#39f28b;--bad:#ff4d5e;--tx:#eaf2ff;--mu:#8ea3c2;--u:max(4.2px,min(1vh,.56vw));--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--tx);font-family:Cairo,Rajdhani,system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.num,.led{font-family:Rajdhani,Cairo,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.led{color:var(--amb);text-shadow:0 0 10px rgba(255,182,39,.55)}
.hidden{display:none!important}
.chk{background:repeating-conic-gradient(#0b0b0d 0 25%,#f2f2f2 0 50%) 0 0/10px 10px}
/* ---------- glass panels ---------- */
.pn{position:relative;background:linear-gradient(160deg,var(--g1),var(--g2));border:1px solid var(--line);border-radius:var(--r);box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pn.glow::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from var(--ang,0deg),transparent 0 70%,var(--amb) 80%,var(--cy) 90%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 6s linear infinite;pointer-events:none}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--ang:360deg}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.62em 1.3em;border-radius:12px;font-weight:800;font-size:calc(var(--u)*2.3);background:linear-gradient(180deg,#ffc84d,#ff9f1a);color:#1a1204;box-shadow:0 6px 20px rgba(255,160,30,.35),inset 0 1px 0 rgba(255,255,255,.5);position:relative;overflow:hidden;transition:transform .12s,filter .15s;white-space:nowrap}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}
.btn:hover::after{transform:translateX(120%)}.btn:active{transform:scale(.96)}
.btn.cy{background:linear-gradient(180deg,rgba(46,230,255,.18),rgba(46,230,255,.06));color:var(--cy);border:1px solid rgba(46,230,255,.5);box-shadow:0 0 18px rgba(46,230,255,.15)}
.btn.gh{background:rgba(255,255,255,.05);color:var(--tx);border:1px solid var(--line2);box-shadow:none}
.btn.ok{background:linear-gradient(180deg,#5dffa6,#1fcf6e);color:#032010}
.btn.bad{background:linear-gradient(180deg,#ff7a86,#e0303f);color:#fff}
.btn[disabled]{filter:grayscale(1) brightness(.55);pointer-events:none}
.btn.sm{font-size:calc(var(--u)*1.8);padding:.45em .9em;border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.35em .9em;border-radius:99px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-weight:700;font-size:calc(var(--u)*1.75);color:var(--mu);cursor:pointer;transition:.2s;white-space:nowrap}
.chip.on{background:rgba(255,182,39,.15);border-color:var(--amb);color:var(--amb2)}
.ic{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--amb),#ffe08a);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.cy>i{background:linear-gradient(90deg,#1aa9ff,var(--cy))}.bar.ok>i{background:linear-gradient(90deg,#1fcf6e,#8dffbd)}.bar.bad>i{background:linear-gradient(90deg,#ff3b4d,#ff9aa3)}
/* ---------- screens ---------- */
#screens{position:fixed;inset:0;pointer-events:none}
.scr,#hud,#modal{font-size:calc(var(--u)*2.05)}
.cond b{font-size:calc(var(--u)*2.1)}
.scr{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;padding:calc(var(--u)*2.4) calc(var(--u)*3.2);padding-left:max(calc(var(--u)*3.2),env(safe-area-inset-left));padding-right:max(calc(var(--u)*3.2),env(safe-area-inset-right));animation:scrIn .5s cubic-bezier(.2,.8,.2,1) both}
.scr.dim{background:radial-gradient(120% 90% at 50% 40%,rgba(6,10,20,.62),rgba(3,5,12,.94))}
@keyframes scrIn{from{opacity:0;clip-path:inset(0 0 100% 0);transform:translateY(12px)}to{opacity:1;clip-path:inset(0 0 0 0);transform:none}}
.scan{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(46,230,255,.07) 50%,transparent);height:30%;animation:scan 3.5s linear infinite;opacity:.6}
@keyframes scan{from{transform:translateY(-100%)}to{transform:translateY(400%)}}
.hdr{display:flex;align-items:center;gap:calc(var(--u)*1.6);margin-bottom:calc(var(--u)*1.8)}
.hdr h2{margin:0;font-size:calc(var(--u)*3.6);font-weight:900;letter-spacing:.01em}
.hdr .sub{color:var(--mu);font-size:calc(var(--u)*1.8)}
.hdr .sp{flex:1}
.back{width:calc(var(--u)*5.4);height:calc(var(--u)*5.4);border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line2);font-size:calc(var(--u)*2.8)}
[dir=rtl] .back .ic{transform:scaleX(-1)}
.cash{display:flex;align-items:center;gap:.45em;padding:.3em .9em;border-radius:12px;background:#0a0f19;border:1px solid rgba(255,182,39,.35);font-size:calc(var(--u)*2.6);font-weight:700;box-shadow:inset 0 0 18px rgba(255,182,39,.08)}
.cash small{color:var(--mu);font-family:Cairo,sans-serif;font-size:.6em}
.grid{display:grid;gap:calc(var(--u)*1.4)}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(255,182,39,.4) transparent;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.card{padding:calc(var(--u)*1.6);border-radius:14px;background:linear-gradient(160deg,rgba(28,40,68,.75),rgba(10,15,27,.85));border:1px solid var(--line);position:relative;transition:transform .2s,border-color .2s;cursor:pointer}
.card:hover{transform:translateY(-2px);border-color:var(--line2)}.card.sel{border-color:var(--amb);box-shadow:0 0 0 1px var(--amb),0 10px 30px rgba(255,182,39,.15)}
.card.lock{filter:saturate(.3) brightness(.7)}
.lbl{color:var(--mu);font-size:calc(var(--u)*1.55);font-weight:600}
.val{font-size:calc(var(--u)*2.3);font-weight:800}
.t1{font-size:calc(var(--u)*2.4);font-weight:800;line-height:1.25}
.row{display:flex;align-items:center;gap:calc(var(--u)*1)}
.tag{font-size:calc(var(--u)*1.35);padding:.15em .6em;border-radius:6px;background:rgba(46,230,255,.12);color:var(--cy);font-weight:700;white-space:nowrap}
.tag.a{background:rgba(255,182,39,.14);color:var(--amb2)}.tag.g{background:rgba(57,242,139,.12);color:var(--ok)}.tag.r{background:rgba(255,77,94,.14);color:#ff9aa3}
/* ---------- hub ---------- */
.hub{padding:0}
.hub .top{position:absolute;top:calc(var(--u)*2);inset-inline:calc(var(--u)*3);display:flex;align-items:center;gap:calc(var(--u)*1.4)}
.prof{display:flex;align-items:center;gap:.7em;padding:.35em .9em .35em .35em;border-radius:99px;cursor:pointer}
[dir=rtl] .prof{padding:.35em .35em .35em .9em}
.ava{width:calc(var(--u)*5.6);height:calc(var(--u)*5.6);border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:calc(var(--u)*2.2);background:conic-gradient(var(--amb) var(--p,30%),rgba(255,255,255,.1) 0);position:relative}
.ava::after{content:attr(data-l);position:absolute;inset:4px;border-radius:50%;background:#0d1424;display:grid;place-items:center;color:var(--amb2)}
.rail{position:absolute;top:50%;transform:translateY(-44%);inset-inline-start:calc(var(--u)*3);display:flex;flex-direction:column;gap:calc(var(--u)*1.1)}
.rb{display:flex;align-items:center;gap:.8em;padding:.55em 1em .55em .6em;border-radius:14px;font-weight:800;font-size:calc(var(--u)*2);min-width:calc(var(--u)*24);position:relative;transition:transform .2s}
[dir=rtl] .rb{padding:.55em .6em .55em 1em}
.rb:hover{transform:translateX(4px)}[dir=rtl] .rb:hover{transform:translateX(-4px)}
.rb .bi{width:calc(var(--u)*4.6);height:calc(var(--u)*4.6);border-radius:12px;display:grid;place-items:center;background:rgba(255,182,39,.12);color:var(--amb);font-size:calc(var(--u)*2.4)}
.rb.cyb .bi{background:rgba(46,230,255,.12);color:var(--cy)}
.dot{position:absolute;top:6px;inset-inline-end:8px;width:10px;height:10px;border-radius:50%;background:var(--bad);box-shadow:0 0 10px var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.4);opacity:.6}}
.logo{position:absolute;top:13%;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
.logo .en{font-family:Rajdhani,sans-serif;font-weight:700;font-size:calc(var(--u)*13);line-height:.8;letter-spacing:.08em;background:linear-gradient(180deg,#fff 20%,#ffd98a 55%,#ff9f1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(255,160,30,.35));font-style:italic}
.logo .ar{font-weight:900;font-size:calc(var(--u)*6.4);color:#fff;margin-top:calc(var(--u)*.4);text-shadow:0 4px 20px rgba(0,0,0,.6)}
.logo .band{height:calc(var(--u)*1.4);width:calc(var(--u)*40);margin:calc(var(--u)*1) auto 0;border-radius:3px;opacity:.9;animation:bandmv 2s linear infinite}
@keyframes bandmv{to{background-position:20px 0}}
.logo .tg{margin-top:calc(var(--u)*1);color:var(--amb2);font-weight:700;font-size:calc(var(--u)*2.1);letter-spacing:.06em}
.cta{position:absolute;bottom:calc(var(--u)*6);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.2)}
.cta .btn{font-size:calc(var(--u)*3.4);padding:.55em 2.2em;border-radius:18px}
.cta .modes{display:flex;gap:calc(var(--u)*1)}
.today{position:absolute;inset-inline-end:calc(var(--u)*3);top:50%;transform:translateY(-44%);width:calc(var(--u)*34);padding:calc(var(--u)*1.8)}
.mini-m{display:flex;flex-direction:column;gap:.25em;margin-top:calc(var(--u)*1.1)}
/* ---------- showroom ---------- */
.show{display:grid;grid-template-columns:1.1fr 1fr;gap:calc(var(--u)*2);flex:1;min-height:0}
.stage{position:relative;border-radius:18px;overflow:hidden;background:radial-gradient(70% 60% at 50% 70%,rgba(255,182,39,.16),transparent 70%),linear-gradient(180deg,#0e1628,#05080f);border:1px solid var(--line)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage .nav{position:absolute;top:50%;transform:translateY(-50%);width:calc(var(--u)*6);height:calc(var(--u)*6);border-radius:50%;display:grid;place-items:center;background:rgba(255,182,39,.9);color:#1a1204;font-size:calc(var(--u)*3);font-weight:900;z-index:2}
.stage .nav.l{inset-inline-start:12px}.stage .nav.r{inset-inline-end:12px}
.vname{position:absolute;bottom:0;inset-inline:0;padding:calc(var(--u)*1.6);background:linear-gradient(0deg,rgba(0,0,0,.75),transparent);display:flex;align-items:flex-end;gap:1em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1.1)}
.stat{padding:calc(var(--u)*1.2) calc(var(--u)*1.4);border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.stat .val{font-family:Rajdhani,Cairo,sans-serif;font-size:calc(var(--u)*2.8)}
/* ---------- workshop ---------- */
.shop{display:grid;grid-template-columns:calc(var(--u)*38) 1fr;gap:calc(var(--u)*2);flex:1;min-height:0}
.mech{padding:calc(var(--u)*1.6);display:flex;flex-direction:column;gap:calc(var(--u)*1.2)}
.mech svg{width:100%;height:auto;max-height:calc(var(--u)*26)}
.say{font-size:calc(var(--u)*1.95);line-height:1.6;min-height:4.8em;color:#f3e7cc}
.say::after{content:"▍";color:var(--amb);animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.parts{grid-template-columns:repeat(auto-fill,minmax(calc(var(--u)*26),1fr))}
.pips{display:flex;gap:4px}.pips i{width:calc(var(--u)*2.4);height:6px;border-radius:3px;background:rgba(255,255,255,.12)}.pips i.on{background:var(--amb);box-shadow:0 0 8px rgba(255,182,39,.6)}
.cond{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:calc(var(--u)*1.2);padding:calc(var(--u)*1.1) calc(var(--u)*1.4);border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.sw{width:calc(var(--u)*5);height:calc(var(--u)*5);border-radius:12px;border:2px solid transparent;cursor:pointer}.sw.on{border-color:var(--amb);box-shadow:0 0 12px var(--amb)}
/* ---------- modal ---------- */
#modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(2,4,10,.55);backdrop-filter:blur(4px);z-index:30;animation:fade .25s both}
#modal>.pn{width:min(92vw,calc(var(--u)*78));max-height:88vh;padding:calc(var(--u)*2.6);animation:pop .35s cubic-bezier(.2,1.3,.3,1) both}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(.9) translateY(10px);opacity:0}}
.mtitle{font-size:calc(var(--u)*3);font-weight:900;margin:0 0 .3em}
.mrow{display:flex;gap:calc(var(--u)*1.2);flex-wrap:wrap;margin-top:calc(var(--u)*1.8)}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;direction:ltr}
#hud .pn{border-radius:14px}
.h-tl{position:absolute;top:calc(var(--u)*1.6);left:max(calc(var(--u)*2),env(safe-area-inset-left));display:flex;flex-direction:column;gap:calc(var(--u)*.8);width:calc(var(--u)*34)}
.h-cash{display:flex;align-items:center;gap:.6em;padding:.35em .8em;font-size:calc(var(--u)*3);font-weight:700}
.h-cash .d{font-size:.62em;color:var(--ok);font-family:Rajdhani}
.feed{display:flex;flex-direction:column;gap:calc(var(--u)*.6)}
.fi{padding:.42em .8em;border-radius:10px;font-size:calc(var(--u)*1.75);font-weight:700;background:rgba(10,16,28,.82);border-inline-start:3px solid var(--cy);animation:fin .35s cubic-bezier(.2,.9,.2,1) both;backdrop-filter:blur(6px)}
.fi.warn{border-color:var(--amb)}.fi.bad{border-color:var(--bad);color:#ffc2c8}.fi.ok{border-color:var(--ok)}.fi.fun{border-color:#ff5fa2}.fi.pax{border-color:#b98cff}
@keyframes fin{from{opacity:0;transform:translateX(-20px)}}
.h-route{position:absolute;top:calc(var(--u)*1.6);left:50%;transform:translateX(-50%);width:min(46vw,calc(var(--u)*80));padding:calc(var(--u)*1) calc(var(--u)*1.6) calc(var(--u)*1.2)}
.rt-line{position:relative;height:calc(var(--u)*3);margin-top:calc(var(--u)*.5);flex:1 1 auto}
.rt-line .trk{position:absolute;top:50%;left:0;right:0;height:4px;margin-top:-2px;border-radius:2px;background:rgba(255,255,255,.12)}
.rt-line .fil{position:absolute;top:50%;left:0;height:4px;margin-top:-2px;border-radius:2px;background:linear-gradient(90deg,var(--amb),var(--cy));box-shadow:0 0 10px rgba(46,230,255,.5)}
.rt-line .st{position:absolute;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:#0a0f19;border:2px solid var(--mu)}
.rt-line .st.v{border-color:var(--amb);background:var(--amb)}.rt-line .st.d{border-color:#ff9a3c;box-shadow:0 0 10px #ff9a3c}
.rt-line .me{position:absolute;top:50%;width:18px;height:18px;margin:-9px;border-radius:5px;background:var(--cy);box-shadow:0 0 14px var(--cy);transition:left .2s linear}
.rt-info{display:flex;justify-content:space-between;align-items:baseline;gap:1em;font-size:calc(var(--u)*1.7);direction:var(--dir)}
.rt-info b{color:var(--amb2);font-size:1.12em}
.h-tr{position:absolute;top:calc(var(--u)*1.6);right:max(calc(var(--u)*2),env(safe-area-inset-right));display:flex;gap:calc(var(--u)*.8);align-items:flex-start}
.hb{pointer-events:auto;min-width:calc(var(--u)*6.2);height:calc(var(--u)*6.2);border-radius:14px;display:grid;place-items:center;font-size:calc(var(--u)*2.6);padding:0 .5em;font-weight:800}
.hb.on{border-color:var(--cy);color:var(--cy);box-shadow:0 0 16px rgba(46,230,255,.35)}
.hb.am.on{border-color:var(--amb);color:var(--amb)}
.clock{padding:.3em .8em;text-align:center;font-size:calc(var(--u)*2.4);font-weight:700;line-height:1.1}.clock small{display:block;font-size:.58em;color:var(--mu);font-family:Cairo,sans-serif}
.paxbox{padding:.3em .8em;font-size:calc(var(--u)*2.4);font-weight:700;display:flex;align-items:center;gap:.4em}
/* controls */
.h-bl{position:absolute;bottom:calc(var(--u)*1.8);left:max(calc(var(--u)*2),env(safe-area-inset-left));display:flex;gap:calc(var(--u)*1.2);align-items:flex-end}
.gearbox{pointer-events:auto;display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:16px}
.gearbox button{width:calc(var(--u)*7);height:calc(var(--u)*5.6);border-radius:10px;font-family:Rajdhani,sans-serif;font-weight:700;font-size:calc(var(--u)*2.8);color:var(--mu);background:rgba(255,255,255,.04);line-height:1}
.gearbox button small{display:block;font-family:Cairo,sans-serif;font-size:.42em}
.gearbox button.on{background:linear-gradient(180deg,rgba(57,242,139,.3),rgba(57,242,139,.1));color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.gearbox button.on.r{background:linear-gradient(180deg,rgba(255,77,94,.3),rgba(255,77,94,.1));color:#ff9aa3;box-shadow:inset 0 0 0 1px var(--bad)}
.ctlcol{display:flex;flex-direction:column;gap:calc(var(--u)*1)}
.ctlrow{display:flex;gap:calc(var(--u)*1)}
.eng{pointer-events:auto;width:calc(var(--u)*10);height:calc(var(--u)*10);border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:calc(var(--u)*1.6);background:radial-gradient(circle at 40% 35%,#ff6b77,#b3141f);box-shadow:0 0 0 4px rgba(255,77,94,.25),0 10px 30px rgba(0,0,0,.5);color:#fff;text-align:center;line-height:1.1}
.eng.on{background:radial-gradient(circle at 40% 35%,#6dffae,#0f9a4c);box-shadow:0 0 0 4px rgba(57,242,139,.3),0 0 30px rgba(57,242,139,.35)}
.eng .ic{width:2.2em;height:2.2em;display:block;margin:0 auto 2px}
.h-bc{position:absolute;bottom:0;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:calc(var(--u)*1)}
#cl{width:calc(var(--u)*30);height:calc(var(--u)*19);display:block}
.lim{width:calc(var(--u)*6.4);height:calc(var(--u)*6.4);border-radius:50%;background:#fff;border:calc(var(--u)*.8) solid #d6322c;display:grid;place-items:center;color:#111;font-family:Rajdhani,sans-serif;font-weight:700;font-size:calc(var(--u)*2.6);margin-bottom:calc(var(--u)*2);transition:transform .2s}
.lim.over{animation:shake .4s infinite}@keyframes shake{25%{transform:rotate(-8deg) scale(1.08)}75%{transform:rotate(8deg) scale(1.08)}}
.dmg{display:flex;flex-direction:column;gap:3px;margin-bottom:calc(var(--u)*2)}
.dmg i{display:block;width:calc(var(--u)*3.4);height:calc(var(--u)*3.4);border-radius:7px;font-style:normal;font-size:calc(var(--u)*1.8);display:grid;place-items:center;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1)}
.dmg i.w{border-color:var(--amb);color:var(--amb);background:rgba(255,182,39,.12)}.dmg i.b{border-color:var(--bad);color:var(--bad);background:rgba(255,77,94,.15);animation:pulse 1s infinite}
.h-br{position:absolute;bottom:calc(var(--u)*1.8);right:max(calc(var(--u)*2),env(safe-area-inset-right));display:flex;gap:calc(var(--u)*1.2);align-items:flex-end}
.pedal{pointer-events:auto;border-radius:18px;position:relative;overflow:hidden;display:grid;place-items:center;touch-action:none}

/* Some browser extensions replace window.fetch and reject with "Failed to
   fetch" on requests they dislike. Those rejections are not the game's and
   must never reach the fatal error screen. */
addEventListener('unhandledrejection', e => {
  const m = String((e && e.reason && (e.reason.message || e.reason)) || '');
  const st = String((e && e.reason && e.reason.stack) || '');
  if (/Failed to fetch/i.test(m) || /Storage set failed/i.test(m)
      || /about:srcdoc/i.test(st)
      || /chrome-extension:|moz-extension:/i.test(st)) {
    console.warn('[ogra] ignored an extension-blocked request:', m);
    e.preventDefault();
  }
}, true);
</script>

const AU = {
  ctx:null, ok:false, buses:{}, n:{}, eng:null, hornV:null, siren:null, rainOn:false,
  vol:{master:.85, engine:.8, fx:.9, amb:.7, ui:.6}, lastHonk:0, voices:[], babble:[]

AU.init = function(){
  if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
  try {
    const C = this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const m = this.master = C.createGain(); m.gain.value = this.vol.master;
    const comp = C.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    m.connect(comp); comp.connect(C.destination);
    for (const b of ['engine','fx','amb','ui']) { const g = C.createGain(); g.gain.value = this.vol[b]; g.connect(m); this.buses[b] = g; }
    // noise buffers
    const mk = (type) => { const len = C.sampleRate * 3, buf = C.createBuffer(1, len, C.sampleRate), d = buf.getChannelData(0); let b0=0,b1=0,b2=0,last=0;
      for (let i = 0; i < len; i++) { const w = Math.random()*2-1;
        if (type === 'white') d[i] = w;
        else if (type === 'pink') { b0 = .997*b0 + w*.029; b1 = .985*b1 + w*.032; b2 = .95*b2 + w*.048; d[i] = (b0+b1+b2)*1.6; }
        else { last = (last + .02*w)/1.02; d[i] = last*3.2; } }
      return buf; };
    this.nb = {white:mk('white'), pink:mk('pink'), brown:mk('brown')};
    this.ok = true;
    this.buildEngine(); this.buildRoad(); this.buildAmb();
  } catch(e) { this.ok = false; }

AU.noise = function(type, dest){ const s = this.ctx.createBufferSource(); s.buffer = this.nb[type]; s.loop = true; s.loopStart = Math.random(); if (dest) s.connect(dest); s.start(0, Math.random()*2); return s; };

  this.master.gain.value = Math.min(1.6, this.vol.master*B);
  for (const b in this.buses) this.buses[b].gain.value = Math.min(1.6, (this.vol[b] || 0)*B); };

  e.g1 = C.createGain(); e.g2 = C.createGain(); e.g3 = C.createGain();
  e.o1.connect(e.g1); e.o2.connect(e.g2); e.o3.connect(e.g3); e.g1.connect(e.pre); e.g2.connect(e.pre); e.g3.connect(e.pre);

AU.engineTick = function(p){

const LIC_TYPES = [

   d:{en:'Lets you drive cars. Not valid for a microbus or a bus.',ar:'تسمح لك بقيادة الملاكي. مش سارية للميكروباص أو الأتوبيس.'}},

    if (G.save.set.autoDoor && !car.door) { car.door = true; AU.door(car.spec.cat === 'bus' || car.spec.cat === 'minibus' ? 'bus' : 'van'); }

/* =================== ACTIONS =================== */
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
UI.act = function(a, p, el){ const s = S(), u = UI.sel; AU.init(); AU.ui();
  switch (a) {
  case 'nav': UI.show(p, el && el.dataset ? el.dataset.q : undefined); break;
  case 'lang': case 'setlang': setLang(a === 'lang' ? (LANG.cur === 'ar' ? 'en' : 'ar') : p); UI.refresh(); break;
  case 'tab': u.tab = p; UI.show('routes', p); break;
  case 'filter': u.filter = p; UI.refresh(); break;
  case 'route': u.route = p; UI.refresh(); break;
  case 'region': u.region = p; UI.refresh(); break;
  case 'pickveh': u[u.tab === 'go' ? 'gvid' : 'vid'] = p; UI.refresh(); break;
  case 'tod': u.tod = p; UI.refresh(); break;
  case 'nope': AU.ui('no'); break;
  case 'fillup': { const vid = u.tab === 'go' ? u.gvid : u.vid, sp = vehById(vid), own = s.owned[vid], E = effSpec(sp, own), need = E.tank - own.fuel, cost = Math.round(need*FUEL[E.fuelType].price); if (s.cash < cost) { UI.toast(t('need_cash')); AU.ui('no'); break; } s.cash -= cost; own.fuel = E.tank; AU.cash(); saveGame(); UI.refresh(); break; }
  case 'start': startGame(); break;
  case 'cat': u.cat = p; u.si = 0; UI.refresh(); break;
  case 'si': { const n = VEH.filter(v => !v.hidden && (u.cat === 'all' || catOf(v) === u.cat)).length; u.si = (u.si + (+p) + n) % n; UI.refresh(); AU.ui('open'); break; }
  case 'buy': { const v = vehById(p); if (s.cash < v.price) { UI.toast(t('need_cash')); break; } s.cash -= v.price; s.owned[p] = newOwn(v, false); if (v.cat === 'car') s.cur.go = p; else s.cur.line = p; AU.cash(); AU.ding(); UI.toast(t('bought')); checkAch(); saveGame(); UI.refresh(); break; }
  case 'choose': { const v = vehById(p); if (v.cat === 'car') s.cur.go = p; else s.cur.line = p; saveGame(); UI.refresh(); break; }
  case 'wveh': u.wvid = p; UI.refresh(); break;
  case 'wtab': u.wtab = p; UI.refresh(); break;
  case 'repair': { const v = vehById(u.wvid), own = s.owned[v.id], ks = p === 'all' ? COND : [p]; const cost = ks.reduce((a, k) => a + Math.round((100 - own.cond[k])*REPAIR_PER[k]*(CATMUL[v.cat] || 1)), 0); if (s.cash < cost) break;
    s.cash -= cost; ks.forEach(k => own.cond[k] = 100); AU.clunk(.4); setTimeout(() => AU.ding(), 300); stat('repair'); UI.mechLine = t('mech_done'); saveGame(); UI.refresh(); break; }
  case 'upg': { const v = vehById(u.wvid), own = s.owned[v.id], pt = PARTS.find(q => q.id === p), lv = own.up[p] || 0, cost = partCost(pt, lv, v.cat); if (s.cash < cost || lv >= pt.max) break;
    s.cash -= cost; own.up[p] = lv + 1; if (p === 'tank') own.fuel = Math.min(own.fuel, effSpec(v, own).tank); AU.clunk(.5); AU.burst('white', .4, 'bandpass', 3000, 2, .1, null, .2); setTimeout(() => AU.ding(), 400); s.ach.upgrade || unlockAch('upgrade'); UI.mechLine = t('mech_up'); saveGame(); UI.refresh(); break; }
  case 'paint': { const own = s.owned[u.wvid]; if (own.paint === p) break; if (s.cash < 800) { UI.toast(t('need_cash')); break; } s.cash -= 800; own.paint = p; AU.burst('pink', .8, 'bandpass', 2500, 1, .12); saveGame(); UI.refresh(); break; }
  case 'hornTest': AU.hornOn(p); setTimeout(() => AU.hornOff(), 700); break;
  case 'horn': { const own = s.owned[u.wvid], h = HORNS.find(q => q.id === p); own.horns = own.horns || ['std']; if (!own.horns.includes(p)) { if (s.cash < h.price) break; s.cash -= h.price; own.horns.push(p); AU.cash(); } own.horn = p; saveGame(); UI.refresh(); break; }
  case 'sticker': s.owned[u.wvid].sticker = p; saveGame(); UI.refresh(); break;
  case 'claimM': { const m = s.missions.list[+p]; if (!m || m.c || m.p < m.goal) break; m.c = true; s.cash += MISSION_POOL.find(q => q.id === m.id).rw; AU.coins(); AU.ding(); saveGame(); UI.refresh(); break; }
  case 'daily': { if (s.daily.last === todayStr()) break; const y = new Date(); y.setDate(y.getDate() - 1); const ys = y.getFullYear() + '-' + (y.getMonth() + 1) + '-' + y.getDate(); if (s.daily.last !== ys) s.daily.streak = 0; const amt = DAILY[s.daily.streak % 7]; s.daily.streak++; s.daily.last = todayStr(); s.cash += amt; AU.coins(); UI.toast('+' + fmt(amt) + ' EGP'); saveGame(); UI.refresh(); break; }
  case 'spin': { if (UI.spinning) break; if (p === 'paid') { if (s.cash < 500) break; s.cash -= 500; } else { if (s.daily.spin === todayStr()) break; s.daily.spin = todayStr(); }
    UI.spinning = true; const i = Math.floor(Math.random()*WHEEL.length), deg = 360*6 + (360 - (i*360/WHEEL.length + 180/WHEEL.length)); const w = $('#wheel'); w.style.transform = `rotate(${deg}deg)`;
    let n = 0; const tick = setInterval(() => { AU.tone(1800, .02, 'square', .03, AU.buses.ui); if (++n > 30) clearInterval(tick); }, 130);
    setTimeout(() => { UI.spinning = false; s.cash += WHEEL[i]; AU.coins(); AU.ding(); UI.toast(t('won', {c:fmt(WHEEL[i])}), 2400); saveGame(); UI.refresh(); }, 4400); break; }
  case 'set': s.set[p] = !s.set[p]; saveGame(); UI.refresh(); break;
  case 'traffic': s.set.traffic = +p; saveGame(); UI.refresh(); break;
  case 'qual': s.set.q = p; saveGame(); resize(); UI.refresh(); break;
  case 'export': { const code = btoa(unescape(encodeURIComponent(JSON.stringify(s)))); try { navigator.clipboard.writeText(code); UI.toast(t('copied')); } catch(e) { prompt('', code); } break; }
  case 'import': { const code = prompt(t('import')); if (!code) break; try { const d = JSON.parse(decodeURIComponent(escape(atob(code.trim())))); if (d && d.owned) { GAME.save = Object.assign(defSave(), d); saveGame(); setLang(GAME.save.lang); UI.show('hub'); } } catch(e) { AU.ui('no'); } break; }
  case 'reset': UI.modalShow(`<div class="mtitle">${t('reset_q')}</div><div class="mrow"><button class="btn bad" data-a="resetYes">${t('reset')}</button><button class="btn gh" data-a="mclose">${t('back')}</button></div>`); break;
  case 'resetYes': GAME.save = defSave(); GAME.save.lang = LANG.cur; saveGame(); UI.modalHide(); UI.show('hub'); break;
  case 'mclose': UI.modalHide(); break;
  // in-game
  case 'resume': UI.modalHide(); GAME.paused = false; break;

  case 'quit': UI.modalHide(); GAME.paused = false; finishSession(GAME.G, false); UI.toHub(); break;
  case 'fuelBuy': { const G = GAME.G, car = G.car, E = car.E, want = Math.max(0, Math.min(E.tank - car.fuel, E.tank*(+p))), cost = Math.round(want*FUEL[E.fuelType].price); if (want <= 0) break; const avail = s.cash + tripNet(G); if (avail < cost) { UI.toast(t('need_cash')); break; }

function smartAI(G, dt){
  if (!G || GAME.state !== 'play' || !G.traffic) return;
  const car = G.car, W = G.world;
  for (const o of G.traffic) {
    if (o.parked) continue;
    const cruise = (o.v0 != null ? o.v0 : 12);
    let cap = cruise;                       /* a ceiling, not a target */

    /* stop for a red, ease for an amber - only close to the line */
    if (W.tl) for (const l of W.tl) {
      const d = (o.lp > .5 ? (o.x - l.x) : (l.x - o.x));
      if (d > 0 && d < 26) {
        if (l.st === 'r') cap = Math.min(cap, d < 7 ? 0 : d*0.45);
        else if (l.st === 'y' && d < 14) cap = Math.min(cap, d*0.7);
      }
    }
    /* keep a gap from the vehicle directly ahead in the same lane */
    let gap = 1e9;
    for (const q of G.traffic) {
      if (q === o || q.parked || Math.abs(q.lp - o.lp) > .4) continue;
      const d = (o.lp > .5 ? (o.x - q.x) : (q.x - o.x));
      if (d > 0 && d < gap) gap = d;
    }
    const pd = (o.lp > .5 ? (o.x - car.x) : (car.x - o.x));
    if (pd > 0 && pd < gap && Math.abs(o.lp - laneLp(car.lane)) < .4) gap = pd;
    /* a following AI needs room to stop, not just a body length: reaction time
       plus braking distance, so it does not rear-end you every time you slow */
    const safe = o.L * 1.2 + Math.abs(o.v || 0) * 1.35 + 4;
    if (gap < safe) cap = Math.min(cap, cruise * Math.max(0, gap / safe));

    /* never park a car in the road: if the way is clear, get moving again */
    if (gap > safe * 1.5) cap = cruise;        /* get moving again sooner */
    /* On a fast road a queue is far more disruptive than on a city street, so
       thin the traffic and let it run closer to the limit. */
    if (limit > 22) {                          /* above about 80 km/h */
      cap = Math.max(cap, cruise * 0.92);
      if (gap > safe) cap = cruise;
    }

    const v = o.v == null ? cruise : o.v;
    const accel = 4.5 * dt, brake = 9 * dt;
    o.v = v > cap ? Math.max(cap, v - brake) : Math.min(cap, v + accel);
    if (o.v < .12 && cap > .5) o.v = .12;   /* no permanent standstill */
    /* and nothing may crawl for ever: if the road ahead is clear but it is
       still dawdling, wind it back up to the limit */
    if (o.v < cruise * 0.45 && gap > safe * 2) {
      o.slowT = (o.slowT || 0) + dt;

  expect(n){ this.allow = Math.max(this.allow || 0, n*1.1 + 5000); },

    /* Served over http(s) means the Supabase build, where the server is the
       only authority on money. The local watchdog would double-judge every
       legitimate change, so it never arms here - and any ban it recorded

    if (location.protocol === 'http:' || location.protocol === 'https:') {

function seedCameras(G){
  if (!G || !G.world || G._cams) return;
  const W = G.world, len = W.len || 4000, out = [];
  const step = 550 + Math.random()*450;
  for (let x = step; x < len - 150; x += step + Math.random()*550) {
    const seg = W.segAt ? W.segAt(x) : null;
    out.push({x, lim:(seg && seg.lim) || 60, done:false, flash:0});
  }
  G._cams = out;
}
function camTick(G, dt){
  if (!G || GAME.state !== 'play') return;
  seedCameras(G);
  const car = G.car, kmh = Math.abs(car.vx)*3.6;
  for (const c of G._cams) {
    if (c.flash > 0) c.flash = Math.max(0, c.flash - dt*2.2);
    if (c.done || Math.abs(car.x - c.x) > 2.2) continue;
    c.done = true; c.flash = 1;
    if (kmh > c.lim + 10) {
      const fine = 150 + Math.round((kmh - c.lim)*14);
      G.fine('cam_flash', fine, {});
      try { licPoints(S(), 1); AU.camera(); } catch(e) {}
      RD.flashT = .35;

  }
}
function drawCameras(G){
  const c = RD.ctx, W = G.world, P = RD.PPM;
  if (!G._cams) return;
  for (const cm of G._cams) {
    const dx = cm.x - RD.camL;
    if (dx < -6 || dx > RD.W/P + 8) continue;
    const x = RD.sx(cm.x), gy = RD.sy(W.h(cm.x), -.35);
    const h = 3.4*P;

    c.fillStyle = '#6c7683'; c.fillRect(x - .09*P, gy - h, 1.0*P, .12*P);      // arm
    c.fillStyle = '#2b3340'; RD.rr ? 0 : 0;
    c.fillRect(x + .62*P, gy - h - .42*P, .62*P, .52*P);                        // housing
    c.fillStyle = '#11161f'; c.fillRect(x + .70*P, gy - h - .30*P, .30*P, .26*P); // lens
    c.fillStyle = '#c9ced6'; c.font = `700 ${Math.max(7, .3*P)}px Rajdhani, sans-serif`;
    c.textAlign = 'center'; c.fillText(String(cm.lim), x + .93*P, gy - h + .42*P);
    if (cm.flash > 0) {                                                         // the flash
      c.globalAlpha = cm.flash;
      const g = c.createRadialGradient(x + .9*P, gy - h - .05*P, 0, x + .9*P, gy - h - .05*P, 3.2*P);

  try {
    const s = S(); if (!s || s.__sealed) return;
    ['cash','xp','lvl'].forEach(key => {
      let v = s[key];
      Object.defineProperty(s, key, {
        configurable: true, enumerable: true,
        get(){ return v; },
        set(nv){
          if (typeof ogOnline === 'function' && ogOnline() && !OGRA_NET.adopting) {
            console.warn('[ogra] blocked local write to ' + key + ':', v, '->', nv,
                         '\n' + (new Error().stack || '').split('\n').slice(2, 4).join('\n'));
            return;                       /* the server is the only authority */
          }
          v = nv;
        }
      });
    });
    Object.defineProperty(s, '__sealed', {value:true, enumerable:false});
  } catch(e) { console.warn('[ogra] seal', e); }
}
setInterval(() => { try { if (ogOnline()) sealEconomy(); } catch(e) {} }, 1500);


/* ================= damage model =================
   Impacts are graded by energy and where they land. Each panel carries its own
   condition, and the little vehicle icon on the route bar shows it. */
const DMG_ZONES = ['front','rear','left','right','engine','susp','tires','brakes','body','glass'];

function dmgApply(G, other, kmh, side){
  const own = G.own; if (!own) return;
  own.cond = own.cond || {};
  DMG_ZONES.forEach(z => { if (own.cond[z] == null) own.cond[z] = 100; });

  const E = Math.max(0, kmh) / 60;                 /* 60 km/h = a full unit */
  const sev = Math.min(1.6, E * E);                /* energy rises with the square */
  const heavy = other && other.L ? Math.min(2, (other.L || 4) / 4.5) : 1;
  const hit = sev * heavy;

  const drop = (zone, mult) => {
    own.cond[zone] = Math.max(0, own.cond[zone] - hit * mult * 26);
  };
  /* where it landed takes the worst of it */
  if (side > 0) { drop('front', 1.0); drop('engine', .55); drop('glass', .30); }
  else          { drop('rear',  1.0); drop('body',   .45); }
  drop('body', .35); drop('susp', .30); drop('tires', .18); drop('brakes', .10);

  /* parts come off once it is bad enough */
  G.car.parts = G.car.parts || {};
  if (hit > .30) G.car.parts[side > 0 ? 'bumpF' : 'bumpR'] = 0;
  if (hit > .45) G.car.parts[side > 0 ? 'headL' : 'tailL'] = 0;
  if (hit > .60) G.car.parts.mirror = 0;
  if (hit > .75) G.car.parts.door = 0;
  if (hit > .55) G.car.dentF = Math.min(1, (G.car.dentF || 0) + hit * .5);

  /* a hard enough knock is felt in how it drives */
  if (own.cond.susp < 45) G.car.pullBias = (G.car.pullBias || 0) + (side > 0 ? .012 : -.012);
  if (own.cond.tires < 35) G.car.gripLoss = Math.min(.35, (G.car.gripLoss || 0) + .06);

  try { RD.shake = Math.max(RD.shake, Math.min(.9, hit)); AU.haptic(Math.round(hit * 60)); } catch(e) {}
}
{ const hook = (G) => {
    if (!G || G._dmg2) return; G._dmg2 = true;
    const prev = G.onCrash;
    G.onCrash = (o, E2, side, rel) => {
      const r = prev ? prev(o, E2, side, rel) : undefined;
      try { dmgApply(G, o, Math.abs(rel || 0) * 3.6, side); } catch(e) {}
      return r;
    };
  };
  const _up = updPeople; updPeople = function(G, dt){ _up(G, dt); try { hook(G); } catch(e) {} }; }

/* ================= loading screen =================
   splash.html is shown in an isolated frame over the game, so its styling
   cannot collide with the game's own, and the address stays at index.html.
   It comes down when the player taps Start, or if it fails to load. */
(function(){
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  if (sessionStorage.getItem('ogra_splash_done')) return;   /* once per visit */

  const host = document.createElement('div');
  host.id = 'ogSplashHost';
  host.setAttribute('style',
    'position:fixed;inset:0;z-index:2147483600;background:#020508;'
    + 'opacity:1;transition:opacity .45s ease');
  const fr = document.createElement('iframe');
  fr.src = 'splash.html';
  fr.setAttribute('style','width:100%;height:100%;border:0;display:block');
  fr.setAttribute('title','OGRA loading');
  host.appendChild(fr);

  const drop = () => {
    try { sessionStorage.setItem('ogra_splash_done', '1'); } catch(e) {}
    host.style.opacity = '0';
    setTimeout(() => { try { host.remove(); } catch(e) {} }, 500);
    window.removeEventListener('message', onMsg);
  };
  const onMsg = e => { if (e && e.data === 'ogra:splash-done') drop(); };
  /* tell the splash as soon as the game is genuinely up, so the bar can
     finish early rather than running a fixed animation */
  const ready = () => { try { fr.contentWindow.postMessage('ogra:game-ready', '*'); } catch(e) {} };
  const pollReady = setInterval(() => {
    if (window.__ogStage && String(window.__ogStage).indexOf('3') === 0) {
      clearInterval(pollReady); ready(); }
  }, 400);
  setTimeout(() => clearInterval(pollReady), 20000);
  window.addEventListener('message', onMsg);

  /* if splash.html is missing or slow, never leave the player stuck behind it */
  fr.addEventListener('error', drop);
  setTimeout(() => { if (document.getElementById('ogSplashHost') && !fr.contentWindow) drop(); }, 4000);

  /* A guaranteed way past the splash: its own Start button sits under an
     animated curtain and can be awkward to hit, so the parent owns a skip
     control and any tap or key on the overlay also dismisses it. */

  const put = () => document.body && document.body.appendChild(host);
  if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
})();

/* ---------- long routes: intercity, not a local service ----------
   Only the last stop before the terminus and the terminus itself take
   passengers. The rest houses stay as service halts, and the remaining
   waypoints become pass-through gates you drive past. */
(function(){
  ROUTES.forEach(r => {
    if (r.len !== 'long' || !Array.isArray(r.st) || r.st.length < 3) return;
    const last = r.st.length - 1;
    r.st.forEach((stop, i) => {
      const isRest = /rest/i.test(stop.n.en || '');
      stop.rest = stop.rest || isRest;
      /* only the last stop before the terminus and the terminus itself
         take passengers; the rest houses remain service halts */
      stop.noBoard = !(i === last || i === last - 1) && !isRest;
      stop.skip = stop.noBoard;
      /* an intercity coach does not call at them at all: hide them from
         the route bar and from the stop logic */
      if (stop.skip) { stop.hidden = true; stop.noStop = true; }
    });
    /* promote the last ordinary stop before the terminus back to a real stop */
    for (let i = r.st.length - 2; i >= 0; i--) {
      if (!r.st[i].rest) { r.st[i].noBoard = false; r.st[i].skip = false;
        r.st[i].hidden = false; r.st[i].noStop = false; break; }
    }
    r.st.forEach(() => {
    });
  });
  const n = ROUTES.filter(r => r.len === 'long').length;
  console.log('routes: intercity boarding applied to ' + n + ' long routes');
})();

/* ================= glow cache =================
   Measured 299 createRadialGradient calls per frame at night - one per lamp,
   window and headlight, rebuilt from scratch every frame. A radial glow is
   the same picture every time apart from size and colour, so bake a handful
   of sprites once and stamp them with drawImage instead. */
const _glowCache = new Map();
function glowSprite(hex, alpha){
  /* quantise so a few hundred lights share a dozen sprites */
  const a = Math.min(1, Math.max(0, Math.round(alpha * 8) / 8));
  const key = hex + '|' + a;
  let cv = _glowCache.get(key);
  if (cv) return cv;
  const R = 64;
  cv = document.createElement('canvas'); cv.width = cv.height = R * 2;
  const g2 = cv.getContext('2d');
  const grd = g2.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, hexA(hex, a));
  grd.addColorStop(0.45, hexA(hex, a * 0.38));
  grd.addColorStop(1, hexA(hex, 0));
  g2.fillStyle = grd; g2.fillRect(0, 0, R * 2, R * 2);
  _glowCache.set(key, cv);
  return cv;
}
function stampGlow(c, x, y, r, hex, alpha){
  if (alpha < .02 || r <= 0) return;
  const cv = glowSprite(hex, alpha);
  c.drawImage(cv, x - r, y - r, r * 2, r * 2);
}

/* ================= the officer at a checkpoint =================
   Eight frames, mirrored so he faces oncoming traffic on the left. He stands
   still until he picks a vehicle, then raises a hand through the wave cycle.
   Whoever he waves at stops - AI or the player. */
const COP_N = 8;
const COP = { idle:0, walk:1, raise:2, out:3, stop:4, wave1:5, wave2:6, hold:7 };
const COPIMG = [];
(function(){ for (let i = 0; i < COP_N; i++) {
  const im = new Image(); im.src = 'assets/new/cop_' + String(i).padStart(2,'0') + '.webp';
  COPIMG.push(im);
} })();

/* which frame to show, from what he is doing */
function copFrame(o, t){
  t = (o.t2 != null) ? o.t2 : t;
  if (o.state === 'waving') {
    const seq = [COP.raise, COP.out, COP.stop, COP.wave1, COP.wave2, COP.stop];
    return seq[Math.floor(t * 6) % seq.length];
  }
  if (o.state === 'holding') return COP.stop;      /* hand out, vehicle stopped */
  if (o.state === 'pass')    return COP.wave2;     /* waving them through */
  return COP.idle;                                  /* standing still */
}

function drawCop(c, o, x, y, P){
  const f = copFrame(o, o.t || 0);
  const im = COPIMG[f] || COPIMG[0];
  if (!im || !im.complete || !im.naturalWidth) return;
  const h = 1.78 * P, w = h * (im.naturalWidth / im.naturalHeight);
  c.drawImage(im, x - w/2, y - h, w, h);
}
