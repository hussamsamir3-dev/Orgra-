# ---- Ogra on Netlify ----
[build]
  publish = "."
  functions = "netlify/functions"
  command = ""

# friendly API paths: /api/trip -> /.netlify/functions/trip
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# the game itself is static; let the browser cache the heavy assets hard
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
