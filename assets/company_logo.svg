<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050C1A;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#0D1B3D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A2F5A;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#0E1F3F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#051018;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:0.5" />
      <stop offset="40%" style="stop-color:#FF8C00;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="cornerGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="waveGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="waveCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#00D4FF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFED4E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E90FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0047AB;stop-opacity:1" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="brightGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="deepShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.5"/>
    </filter>
    <pattern id="techGrid" x="150" y="150" width="150" height="150" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="150" height="150" fill="none" stroke="#FF8C00" stroke-width="0.5" opacity="0.08"/>
      <circle cx="0" cy="0" r="1.5" fill="#00D4FF" opacity="0.2"/>
      <circle cx="150" cy="0" r="1.5" fill="#00D4FF" opacity="0.2"/>
      <circle cx="0" cy="150" r="1.5" fill="#00D4FF" opacity="0.2"/>
      <circle cx="150" cy="150" r="1.5" fill="#00D4FF" opacity="0.2"/>
    </pattern>
    <pattern id="pyramidPattern" x="200" y="200" width="200" height="200" patternUnits="userSpaceOnUse">
      <polygon points="100,20 180,180 20,180" fill="none" stroke="#FF8C00" stroke-width="0.5" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgMain)"/>
  <rect width="1920" height="1080" fill="url(#techGrid)"/>
  <rect width="1920" height="1080" fill="url(#pyramidPattern)" opacity="0.3"/>
  <circle cx="960" cy="540" r="800" fill="url(#centerGlow)" filter="url(#brightGlow)"/>
  <circle cx="300" cy="200" r="400" fill="url(#cornerGlow)" filter="url(#softGlow)"/>
  <circle cx="1650" cy="950" r="500" fill="url(#cornerGlow)" filter="url(#softGlow)"/>

  <g opacity="0.15">
    <circle cx="960" cy="540" r="700" fill="#FF8C00"/>
  </g>

  <line x1="0" y1="540" x2="1920" y2="540" stroke="#FF8C00" stroke-width="1" opacity="0.1"/>
  <line x1="960" y1="0" x2="960" y2="1080" stroke="#1E90FF" stroke-width="0.8" opacity="0.08"/>

  <g opacity="0.25" filter="url(#softGlow)">
    <path d="M 150 250 L 350 200 L 450 450 L 300 500 Z" fill="none" stroke="#FF8C00" stroke-width="2"/>
    <path d="M 1700 650 L 1850 600 L 1900 850 L 1750 900 Z" fill="none" stroke="#00D4FF" stroke-width="2"/>
    <path d="M 700 100 L 850 80 L 950 280 L 850 300 Z" fill="none" stroke="#1E90FF" stroke-width="1.5"/>
    <path d="M 1000 750 L 1150 720 L 1200 950 L 1050 970 Z" fill="none" stroke="#FFD700" stroke-width="1.5"/>
  </g>

  <g transform="translate(250, 150)" opacity="0.5" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="20" fill="#FF8C00"/>
    <circle cx="70" cy="35" r="17" fill="#FF8C00"/>
    <circle cx="140" cy="15" r="18" fill="#FF8C00"/>
    <circle cx="210" cy="55" r="16" fill="#FF8C00"/>
    <circle cx="280" cy="25" r="15" fill="#FF8C00"/>
    <path d="M 0 0 L 70 35 L 140 15 L 210 55 L 280 25" stroke="#FF8C00" stroke-width="1.5" fill="none"/>
    <circle cx="35" cy="18" r="3" fill="#FFD700"/>
    <circle cx="105" cy="25" r="3" fill="#FFD700"/>
    <circle cx="175" cy="35" r="3" fill="#FFD700"/>
    <circle cx="245" cy="40" r="3" fill="#FFD700"/>
  </g>

  <g transform="translate(1550, 800)" opacity="0.45" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="22" fill="#00D4FF"/>
    <circle cx="80" cy="40" r="19" fill="#00D4FF"/>
    <circle cx="160" cy="20" r="20" fill="#00D4FF"/>
    <circle cx="240" cy="60" r="18" fill="#00D4FF"/>
    <path d="M 0 0 L 80 40 L 160 20 L 240 60" stroke="#00D4FF" stroke-width="1.5" fill="none"/>
  </g>

  <path d="M 100 600 Q 500 450 900 600 T 1820 600" stroke="url(#waveGold)" stroke-width="3" fill="none" opacity="0.4" filter="url(#softGlow)"/>
  <path d="M 150 700 Q 550 550 950 700 T 1800 700" stroke="url(#waveCyan)" stroke-width="2.5" fill="none" opacity="0.3"/>
  <path d="M 80 800 Q 480 680 880 800 T 1840 800" stroke="#1E90FF" stroke-width="2" fill="none" opacity="0.2"/>

  <!-- MAIN SEAL LOGO INTEGRATED -->
  <g transform="translate(960, 380)" filter="url(#deepShadow)">
    <!-- Outer rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#FF8C00" stroke-width="3" opacity="0.25" filter="url(#brightGlow)"/>
    <circle cx="0" cy="0" r="170" fill="none" stroke="#00D4FF" stroke-width="2" opacity="0.18" stroke-dasharray="15,15"/>
    <circle cx="0" cy="0" r="200" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.12" stroke-dasharray="30,30"/>
    
    <!-- Cross and diagonals -->
    <path d="M -120 0 L 120 0 M 0 -120 L 0 120 M -85 -85 L 85 85 M -85 85 L 85 -85" stroke="#1E90FF" stroke-width="2" opacity="0.35"/>
    
    <!-- Cardinal markers -->
    <g opacity="0.7" filter="url(#softGlow)">
      <circle cx="-90" cy="-90" r="6" fill="#FF8C00"/>
      <circle cx="90" cy="-90" r="6" fill="#FF8C00"/>
      <circle cx="90" cy="90" r="6" fill="#FF8C00"/>
      <circle cx="-90" cy="90" r="6" fill="#FF8C00"/>
      <circle cx="0" cy="-120" r="5" fill="#00D4FF"/>
      <circle cx="120" cy="0" r="5" fill="#00D4FF"/>
      <circle cx="0" cy="120" r="5" fill="#00D4FF"/>
      <circle cx="-120" cy="0" r="5" fill="#00D4FF"/>
      <circle cx="-60" cy="-60" r="3" fill="#FFD700"/>
      <circle cx="60" cy="-60" r="3" fill="#FFD700"/>
      <circle cx="60" cy="60" r="3" fill="#FFD700"/>
      <circle cx="-60" cy="60" r="3" fill="#FFD700"/>
    </g>
  </g>

  <!-- SEAL HEAD -->
  <g transform="translate(960, 380)" filter="url(#softGlow)">
    <ellipse cx="0" cy="-50" rx="50" ry="65" fill="url(#goldShine)" opacity="0.9"/>
    <ellipse cx="0" cy="-50" rx="48" ry="63" fill="url(#goldGrad)"/>
    
    <!-- Eyes -->
    <circle cx="-22" cy="-65" r="11" fill="#001A4D" opacity="0.95"/>
    <circle cx="22" cy="-65" r="11" fill="#001A4D" opacity="0.95"/>
    <circle cx="-22" cy="-65" r="6.5" fill="#00D4FF" opacity="0.85"/>
    <circle cx="22" cy="-65" r="6.5" fill="#00D4FF" opacity="0.85"/>
    <circle cx="-22" cy="-65" r="3" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="22" cy="-65" r="3" fill="#FFFFFF" opacity="0.8"/>
    
    <!-- Nose -->
    <ellipse cx="0" cy="-40" rx="16" ry="18" fill="#001A4D"/>
    <path d="M -18 -38 L -6 -35 M 18 -38 L 6 -35 M -12 -28 L 12 -28" stroke="#00D4FF" stroke-width="1" opacity="0.7"/>
    <ellipse cx="0" cy="-15" rx="20" ry="15" fill="url(#goldGrad)"/>
    
    <!-- Body -->
    <path d="M -65 10 Q -75 30 -65 50 Q -45 62 -20 60 Q 0 65 20 60 Q 45 62 65 50 Q 75 30 65 10" fill="url(#goldShine)" opacity="0.85"/>
    
    <!-- Flippers -->
    <ellipse cx="-60" cy="35" rx="22" ry="45" fill="url(#goldGrad)" opacity="0.8" transform="rotate(-35 -60 35)"/>
    <ellipse cx="60" cy="35" rx="22" ry="45" fill="url(#goldGrad)" opacity="0.8" transform="rotate(35 60 35)"/>
    
    <!-- Tail -->
    <path d="M -45 65 Q -35 85 -15 95 Q 0 100 15 95 Q 35 85 45 65" fill="url(#goldShine)" opacity="0.75"/>
    
    <!-- Central jewel -->
    <circle cx="0" cy="105" r="10" fill="url(#blueDeep)" opacity="0.9" filter="url(#brightGlow)"/>
    <circle cx="0" cy="105" r="6" fill="#00D4FF" opacity="0.7"/>
  </g>

  <!-- Tech elements around logo -->
  <g opacity="0.2">
    <polygon points="1750,850 1800,800 1850,850 1800,900" fill="none" stroke="#FF8C00" stroke-width="2.5"/>
    <polygon points="150,200 200,150 250,200 200,250" fill="none" stroke="#00D4FF" stroke-width="2.5"/>
    <polygon points="400,850 450,800 500,850 450,900" fill="none" stroke="#1E90FF" stroke-width="2"/>
    <polygon points="1300,300 1350,250 1400,300 1350,350" fill="none" stroke="#FFD700" stroke-width="1.5"/>
  </g>

  <!-- Bottom data line -->
  <g opacity="0.12">
    <line x1="650" y1="950" x2="1270" y2="950" stroke="#FF8C00" stroke-width="1.5"/>
    <circle cx="700" cy="950" r="3" fill="#FF8C00"/>
    <circle cx="800" cy="950" r="3" fill="#FF8C00"/>
    <circle cx="960" cy="950" r="3" fill="#FFD700"/>
    <circle cx="1120" cy="950" r="3" fill="#FF8C00"/>
    <circle cx="1220" cy="950" r="3" fill="#FF8C00"/>
  </g>

  <!-- Main title -->
  <text x="960" y="1000" font-family="Arial, sans-serif" font-size="120" font-weight="900" text-anchor="middle" fill="#FFD700" opacity="0.95" filter="url(#brightGlow)" letter-spacing="4">EGYSeal</text>

  <!-- Subtitle -->
  <text x="960" y="1055" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#00D4FF" opacity="0.8" filter="url(#softGlow)" letter-spacing="3">GAMING • CODING • DESIGN</text>

  <!-- Corner accents -->
  <g opacity="0.08" filter="url(#softGlow)">
    <circle cx="100" cy="80" r="25" fill="none" stroke="#FF8C00" stroke-width="2"/>
    <circle cx="1850" cy="100" r="25" fill="none" stroke="#FF8C00" stroke-width="2"/>
    <circle cx="100" cy="1000" r="25" fill="none" stroke="#00D4FF" stroke-width="2"/>
    <circle cx="1850" cy="1000" r="25" fill="none" stroke="#00D4FF" stroke-width="2"/>
  </g>
</svg>
