<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OGRA</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#05070d;font-family:Cairo,system-ui,sans-serif;color:#f2f6ff;
    -webkit-tap-highlight-color:transparent}
  #sp{position:fixed;inset:0;cursor:pointer;overflow:hidden}
  .shot{position:absolute;inset:0;background:#05070d url('assets/cairo-rain-road.webp') center/cover no-repeat;
    transform:scale(1.08);animation:drift 18s ease-in-out infinite alternate;filter:saturate(.92) contrast(1.06)}
  @keyframes drift{from{transform:scale(1.08) translate3d(0,0,0)}to{transform:scale(1.15) translate3d(-2%,-1.5%,0)}}
  .fallback{position:absolute;inset:0;background:
    radial-gradient(120% 80% at 50% 0%,#1a2846,#0a1020 55%,#05070d 100%)}
  .grade{position:absolute;inset:0;background:
    linear-gradient(180deg,rgba(5,7,13,.72) 0%,rgba(5,7,13,.25) 35%,rgba(5,7,13,.78) 78%,#05070d 100%)}
  .vig{position:absolute;inset:0;background:radial-gradient(75% 60% at 50% 45%,transparent 30%,rgba(3,5,10,.85) 100%)}
  .rain{position:absolute;inset:-10%;opacity:.35;pointer-events:none;
    background:repeating-linear-gradient(104deg,rgba(255,255,255,.22) 0 1px,transparent 1px 12px);
    animation:fall 1.1s linear infinite}
  @keyframes fall{to{transform:translate3d(-40px,140px,0)}}
  .lamp{position:absolute;border-radius:50%;filter:blur(38px);opacity:.5;mix-blend-mode:screen}
  .wrap{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;z-index:3}
  .mark{display:grid;gap:.15em;animation:up 1.2s cubic-bezier(.16,1,.3,1) both}
  @keyframes up{from{opacity:0;transform:translateY(26px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
  .en{font:200 clamp(54px,13vw,150px)/.95 'Rajdhani','Segoe UI',system-ui;letter-spacing:.34em;text-indent:.34em;
    color:#f6f9ff;text-shadow:0 0 44px rgba(150,200,255,.28)}
  .ar{font:800 clamp(22px,5vw,46px)/1 Cairo;color:#e6b455;letter-spacing:.06em;
    text-shadow:0 2px 26px rgba(230,180,85,.35)}
  .rule{width:min(62vw,420px);height:1px;margin:14px auto 0;background:
    linear-gradient(90deg,transparent,rgba(230,180,85,.75),transparent);animation:up 1.2s .15s cubic-bezier(.16,1,.3,1) both}
  .line{margin-top:12px;color:#b9c9df;font:600 clamp(11px,1.9vw,16px) Cairo;letter-spacing:.04em;
    animation:up 1.2s .25s cubic-bezier(.16,1,.3,1) both}
  .foot{position:absolute;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));display:grid;gap:12px;
    justify-items:center;z-index:3;animation:up 1.2s .4s cubic-bezier(.16,1,.3,1) both}
  .track{width:min(58vw,380px);height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
  .fill{height:100%;width:6%;background:linear-gradient(90deg,#e6b455,#fff6df);transition:width .45s cubic-bezier(.3,.9,.3,1)}
  .meta{display:flex;gap:14px;color:#8fa2ba;font:600 11px/1 Rajdhani;letter-spacing:.22em}
  .cta{padding:.85em 2.4em;border-radius:999px;border:1px solid rgba(230,180,85,.55);cursor:pointer;
    background:rgba(9,14,24,.55);backdrop-filter:blur(6px);color:#f4e7cd;font:800 clamp(12px,2vw,16px) Cairo;
    letter-spacing:.06em;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s,background .2s}
  .cta.on{opacity:1;transform:none;animation:breathe 2.6s ease-in-out infinite}
  .cta:active{background:rgba(230,180,85,.2)}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 rgba(230,180,85,0)}50%{box-shadow:0 0 34px rgba(230,180,85,.28)}}
  .curtain{position:absolute;inset:0;background:#05070d;z-index:5;opacity:0;pointer-events:none;transition:opacity .45s}
  #logo{position:fixed;inset:0;z-index:9;overflow:hidden;background:#05070d;
    opacity:0;animation:logoIn 1s ease forwards, logoOut .9s ease 3s forwards}
  #logo img{width:100%;height:100%;object-fit:contain;object-position:center;
    animation:logoZoom 4.2s ease-out both}
  @keyframes logoIn{to{opacity:1}}
  @keyframes logoOut{to{opacity:0;visibility:hidden}}
  @keyframes logoZoom{from{transform:scale(1.06)}to{transform:scale(1)}}
  .curtain.on{opacity:1}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body>
<div id="logo"><img src="assets/company_logo.svg" alt=""></div>
<div id="sp">
  <div class="fallback"></div>
  <div class="shot" id="shot"></div>
  <div class="grade"></div>
  <div class="rain"></div>
  <div class="vig"></div>
  <div class="lamp" style="left:12%;top:30%;width:180px;height:180px;background:#ffcf7a"></div>
  <div class="lamp" style="right:16%;top:22%;width:220px;height:220px;background:#7fd4ff"></div>
  <div class="wrap"><div class="mark">
    <div class="en">OGRA</div>
    <div class="ar">أجرة</div>
    <div class="rule"></div>
    <div class="line">شوارع مصر.. وإنت الأسطى</div>
  </div></div>
  <div class="foot">
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="meta"><span id="pct">6%</span><span id="stage">LOADING</span></div>
    <button class="cta" id="cta">ابدأ</button>
  </div>
  <div class="curtain" id="curtain"></div>
</div>
<script>
  var p = 6, ready = false, done = false;
  var fill = document.getElementById('fill'), pct = document.getElementById('pct'),
      stage = document.getElementById('stage'), cta = document.getElementById('cta'),
      curtain = document.getElementById('curtain');
  var img = new Image();
  img.onerror = function(){ document.getElementById('shot').style.display = 'none'; };
  img.src = 'assets/cairo-rain-road.webp';
  var tick = setInterval(function(){
    p = Math.min(ready ? 100 : 92, p + 3 + Math.random()*7);
    fill.style.width = p + '%'; pct.textContent = Math.round(p) + '%';
    if (p >= 100) { clearInterval(tick); stage.textContent = 'READY'; cta.classList.add('on'); }
  }, 200);
  addEventListener('message', function(e){ if (e && e.data === 'ogra:game-ready') ready = true; });
  setTimeout(function(){ ready = true; }, 7000);
  function go(){
    if (done) return; done = true;
    curtain.classList.add('on');
    setTimeout(function(){ try { parent.postMessage('ogra:splash-done', '*'); } catch(e) {} }, 420);
  }
  var logoUp = true;
  setTimeout(function(){ logoUp = false; var l = document.getElementById('logo'); if (l) l.style.display = 'none'; }, 3900);
  function guard(fn){ return function(e){ if (logoUp) { if (e && e.preventDefault) e.preventDefault(); return; } fn(); }; }
  document.getElementById('sp').addEventListener('click', guard(go));
  document.getElementById('sp').addEventListener('touchend', guard(function(){ go(); }), {passive:false});
  addEventListener('keydown', guard(go));
  setTimeout(function(){ if (!done) go(); }, 16000);
</script>
</body></html>
