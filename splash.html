<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#05090f" />
  <title>OGRA — أجرة</title>
  <style>
    :root{--cyan:#8deaff;--cyan2:#24b8dc;--amber:#ffb449;--ink:#03070c;--muted:#a9b4c0;--mx:0;--my:0;--pulse:0}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020508;color:white;font-family:"Arial",Tahoma,sans-serif}
    button{font:inherit}.stage{position:relative;width:100%;height:100%;isolation:isolate;background:#07111d;perspective:1200px;cursor:default}
    .scene{position:absolute;inset:-8%;background:url("assets/cairo-rain-road.png") center/cover no-repeat,linear-gradient(180deg,#0b1a2b 0%,#123049 38%,#1d2b33 62%,#0a0f14 100%);filter:saturate(.72) contrast(1.08) brightness(calc(.62 + var(--pulse)*.05));transform:translate3d(calc(var(--mx)*-34px),calc(var(--my)*-22px),0) scale(calc(1.12 + var(--pulse)*.018));animation:sceneIn 2.8s cubic-bezier(.2,.8,.2,1) both;will-change:transform,filter}
    .scene:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 44%,transparent 5%,rgba(1,6,12,.2) 43%,rgba(1,4,9,.92) 100%),linear-gradient(180deg,rgba(2,8,16,.28),rgba(2,7,13,.08) 48%,rgba(1,3,7,.82));}
    .fog{position:absolute;inset:0;overflow:hidden;opacity:.62;mix-blend-mode:screen;pointer-events:none}
    .fog:before,.fog:after{content:"";position:absolute;width:80vw;height:24vh;left:-25vw;top:51%;background:radial-gradient(ellipse,rgba(131,196,220,.17),transparent 68%);filter:blur(30px);animation:fog 16s linear infinite}
    .fog:after{top:61%;left:40vw;opacity:.55;animation-duration:23s;animation-direction:reverse}
    canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.rain{z-index:2;opacity:.6}.dust{z-index:7}
    .scan{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.16;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(130,220,255,.06) 4px);mix-blend-mode:screen}
    .light-sweep{position:absolute;z-index:4;width:42vw;height:140vh;top:-25vh;left:-55vw;background:linear-gradient(90deg,transparent,rgba(142,235,255,.075),transparent);transform:rotate(13deg);filter:blur(5px);animation:sweep 7.5s ease-in-out infinite;pointer-events:none}
    .light-sweep:after{content:"";position:absolute;width:26vw;height:110vh;left:-80vw;top:12vh;background:linear-gradient(90deg,transparent,rgba(255,177,68,.085),transparent);transform:rotate(-8deg);animation:sweepWarm 10.5s 2.5s ease-in-out infinite}
    .road-light{position:absolute;z-index:5;left:-15%;right:-15%;bottom:-7%;height:36%;pointer-events:none;opacity:.7;mix-blend-mode:screen;filter:blur(1px);transform:perspective(500px) rotateX(64deg);transform-origin:bottom;background:repeating-linear-gradient(96deg,transparent 0 8%,rgba(255,170,60,.02) 9%,transparent 10% 18%);mask-image:linear-gradient(transparent,#000)}
    .road-light:before,.road-light:after{content:"";position:absolute;width:42%;height:3px;top:38%;left:-45%;border-radius:100%;background:linear-gradient(90deg,transparent,rgba(255,182,77,.9),white,transparent);box-shadow:0 0 12px #ff9f32,0 8px 30px rgba(255,132,24,.55);animation:roadStreak 5.5s linear infinite}
    .road-light:after{top:62%;width:30%;animation-duration:7.8s;animation-delay:1.4s;filter:hue-rotate(155deg);opacity:.6}
    .hud{position:absolute;inset:clamp(18px,3vw,46px);z-index:8;border:1px solid rgba(170,226,240,.16);clip-path:polygon(0 0,18% 0,18% 1px,82% 1px,82% 0,100% 0,100% 24%,calc(100% - 1px) 24%,calc(100% - 1px) 76%,100% 76%,100% 100%,82% 100%,82% calc(100% - 1px),18% calc(100% - 1px),18% 100%,0 100%,0 76%,1px 76%,1px 24%,0 24%);pointer-events:none}
    .topline{position:absolute;z-index:9;top:clamp(22px,3.5vw,54px);left:clamp(25px,4vw,68px);right:clamp(25px,4vw,68px);display:flex;justify-content:space-between;align-items:center;font-family:Consolas,monospace;font-size:10px;letter-spacing:.18em;color:rgba(201,232,239,.6)}
    .signal{display:flex;align-items:center;gap:8px}.signal i{width:6px;height:6px;background:var(--cyan);border-radius:50%;box-shadow:0 0 12px var(--cyan);animation:blink 1.7s steps(1) infinite}
    .main{position:absolute;z-index:10;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6vh 20px 14vh;text-align:center;transform-style:preserve-3d}
    .emblem{position:relative;transform:translate3d(calc(var(--mx)*18px),calc(var(--my)*13px),0) rotateX(calc(var(--my)*-9deg)) rotateY(calc(var(--mx)*12deg)) translateZ(55px);animation:emblemIn 2.2s .4s cubic-bezier(.16,1,.3,1) both;will-change:transform}
    .rings{position:absolute;left:50%;top:50%;width:min(62vw,590px);aspect-ratio:1;transform:translate(-50%,-50%) rotateX(66deg);border:1px solid rgba(117,217,242,.22);border-radius:50%;box-shadow:0 0 55px rgba(42,174,211,.08),inset 0 0 38px rgba(42,174,211,.08);animation:ringSpin 15s linear infinite;pointer-events:none}
    .rings:before,.rings:after{content:"";position:absolute;border:1px dashed rgba(255,180,73,.2);border-radius:50%;inset:10%;animation:ringSpin 10s linear infinite reverse}.rings:after{inset:25%;border-style:solid;border-color:rgba(130,224,245,.2);animation-duration:7s}
    .kicker{font:700 clamp(9px,1vw,12px)/1 Consolas,monospace;letter-spacing:.42em;color:var(--amber);text-transform:uppercase;margin:0 0 14px;opacity:.86}
    .brand{position:relative;margin:0;text-transform:uppercase;font-size:clamp(76px,14vw,190px);font-weight:950;line-height:.72;letter-spacing:-.075em;font-style:italic;color:#eafcff;text-shadow:0 1px 0 #b9dce3,0 2px 0 #7aa3ad,0 3px 0 #496a73,0 5px 0 #19343e,0 10px 22px rgba(0,0,0,.75),0 0 38px rgba(68,210,241,.21);filter:drop-shadow(0 28px 24px rgba(0,0,0,.45))}
    .brand:before{content:"OGRA";position:absolute;inset:0;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.2);transform:translate(10px,11px);filter:blur(1px);opacity:.4;z-index:-1}
    .brand span{display:inline-block;animation:letterFloat 4s ease-in-out infinite}.brand span:nth-child(2){animation-delay:.16s}.brand span:nth-child(3){animation-delay:.32s}.brand span:nth-child(4){animation-delay:.48s}
    .arabic{position:relative;display:inline-flex;align-items:center;gap:13px;margin-top:23px;font-family:Tahoma,Arial,sans-serif;font-size:clamp(24px,4.2vw,54px);font-weight:800;line-height:1;color:#fff;letter-spacing:0;text-shadow:0 7px 22px #000}
    .arabic:before,.arabic:after{content:"";width:clamp(32px,5vw,70px);height:1px;background:linear-gradient(90deg,transparent,var(--amber))}.arabic:after{transform:scaleX(-1)}
    .tear{position:absolute;width:8px;height:13px;right:23%;top:42%;background:linear-gradient(#bdedff,#2d9fc8);border-radius:70% 30% 60% 40%/70% 35% 65% 30%;transform:rotate(42deg);box-shadow:0 0 12px rgba(107,217,255,.8);animation:tear 4s ease-in-out infinite}
    .subtitle{margin-top:19px;font:500 clamp(10px,1.1vw,13px)/1.5 Consolas,monospace;letter-spacing:.24em;color:rgba(222,239,244,.63);text-transform:uppercase}
    .route-board{position:relative;margin:24px auto 0;display:flex;align-items:center;justify-content:center;gap:13px;width:max-content;max-width:88vw;padding:8px 15px 9px;border:1px solid rgba(255,188,76,.58);border-radius:3px;background:linear-gradient(180deg,rgba(34,25,13,.9),rgba(8,10,12,.88));box-shadow:0 7px 20px rgba(0,0,0,.45),inset 0 0 18px rgba(255,161,42,.06);font:700 12px/1 Tahoma,Arial,sans-serif;color:#ffe6b7;transform:translateZ(30px);overflow:hidden}
    .route-board:before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 25%,rgba(255,255,255,.16) 44%,transparent 61%);transform:translateX(-150%);animation:boardShine 4.8s 2.2s ease-in-out infinite}.route-board b{color:var(--amber);font:900 10px Consolas,monospace;letter-spacing:.08em}.route-board .arrow{color:var(--cyan);animation:routeArrow 1.1s ease-in-out infinite}
    .taxi-check{position:absolute;z-index:9;top:88px;left:50%;width:min(700px,78vw);height:5px;transform:translateX(-50%);opacity:.5;background:repeating-linear-gradient(90deg,#f5d18f 0 9px,transparent 9px 18px);mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);animation:checkMove 2.6s linear infinite;pointer-events:none}
    .meter{position:absolute;z-index:9;left:clamp(27px,4vw,68px);bottom:clamp(27px,4vw,62px);display:flex;gap:8px;align-items:center;font:600 10px/1 Consolas,monospace;letter-spacing:.13em;color:rgba(255,221,162,.52);pointer-events:none}.meter i{width:7px;height:7px;border:1px solid var(--amber);border-radius:50%;box-shadow:0 0 9px var(--amber);animation:meterPulse 1.1s ease-in-out infinite}
    .loading{position:absolute;z-index:11;left:50%;bottom:clamp(78px,10vh,116px);width:min(430px,72vw);transform:translateX(-50%);animation:fadeUp 1.2s 1.2s both}
    .readout{display:flex;justify-content:space-between;margin-bottom:9px;font:600 10px/1 Consolas,monospace;letter-spacing:.15em;color:rgba(220,243,248,.62)}
    .track{height:2px;background:rgba(255,255,255,.13);overflow:visible;position:relative}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--cyan2),#dbfaff,var(--amber));box-shadow:0 0 13px rgba(82,216,247,.8);transition:width .2s ease}.bar:after{content:"";position:absolute;top:-2px;width:2px;height:6px;background:white;right:calc(100% - var(--p,0%));box-shadow:0 0 12px white}
    .start{position:absolute;z-index:12;left:50%;bottom:clamp(30px,4.7vh,58px);transform:translateX(-50%);width:max-content;border:0;background:none;color:white;padding:12px 20px;text-transform:uppercase;letter-spacing:.28em;font-size:clamp(11px,1.1vw,14px);font-weight:800;opacity:0;pointer-events:none;cursor:pointer;text-shadow:0 0 18px rgba(130,228,255,.75);transition:opacity .7s ease,transform .25s ease}.start.ready{opacity:1;pointer-events:auto;animation:startPulse 2s ease-in-out infinite}.start:hover{transform:translateX(-50%) scale(1.06)}.start:before,.start:after{content:"";display:inline-block;width:26px;height:1px;margin:0 14px 4px;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
    .skip{position:absolute;z-index:11;right:clamp(27px,4vw,68px);bottom:clamp(27px,4vw,62px);font:10px Consolas,monospace;letter-spacing:.15em;color:rgba(215,232,237,.35)}
    .curtain{position:absolute;z-index:40;inset:0;background:#020407;transform:scaleY(0);transform-origin:top;pointer-events:none}.stage.entering .curtain{animation:curtain .9s cubic-bezier(.77,0,.18,1) forwards}.stage.entering .main{animation:launch .8s ease-in forwards}.stage.entering .scene{transform:scale(1.18);filter:saturate(.2) brightness(.18);transition:1s ease}
    .flash{position:absolute;z-index:39;inset:0;background:white;opacity:0;pointer-events:none}.stage.entering .flash{animation:flash .8s ease-out}
    @keyframes sceneIn{from{opacity:0;transform:scale(1.18)}to{opacity:1}}
    @keyframes emblemIn{from{opacity:0;transform:translateY(45px) scale(.8) rotateX(18deg)}to{opacity:1}}
    @keyframes fadeUp{from{opacity:0;transform:translate(-50%,18px)}to{opacity:1;transform:translate(-50%,0)}}
    @keyframes letterFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes ringSpin{to{transform:translate(-50%,-50%) rotateX(66deg) rotateZ(360deg)}}
    @keyframes fog{from{transform:translateX(-15%)}to{transform:translateX(95vw)}}
    @keyframes sweep{0%,25%{transform:translateX(0) rotate(13deg)}65%,100%{transform:translateX(220vw) rotate(13deg)}}
    @keyframes sweepWarm{0%,18%{transform:translateX(0) rotate(-8deg)}62%,100%{transform:translateX(260vw) rotate(-8deg)}}
    @keyframes roadStreak{0%,12%{transform:translateX(0) scaleX(.45);opacity:0}20%{opacity:.9}72%,100%{transform:translateX(360%) scaleX(1.5);opacity:0}}
    @keyframes boardShine{0%,45%{transform:translateX(-150%)}72%,100%{transform:translateX(150%)}}
    @keyframes routeArrow{50%{transform:translateX(4px);opacity:.45}}
    @keyframes checkMove{to{background-position:18px 0}}
    @keyframes meterPulse{50%{background:var(--amber);box-shadow:0 0 18px var(--amber)}}
    @keyframes blink{0%,62%{opacity:1}63%,100%{opacity:.18}}
    @keyframes tear{0%,58%,100%{opacity:0;transform:translateY(-5px) rotate(42deg)}68%{opacity:1}88%{opacity:0;transform:translateY(32px) rotate(42deg)}}
    @keyframes startPulse{0%,100%{filter:brightness(.8);letter-spacing:.28em}50%{filter:brightness(1.35);letter-spacing:.34em}}
    @keyframes curtain{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
    @keyframes flash{0%,18%,100%{opacity:0}20%{opacity:.5}}
    @keyframes launch{to{opacity:0;transform:scale(1.14);filter:blur(10px)}}
    @media(max-width:600px){.main{padding-bottom:18vh}.hud{inset:14px}.topline{top:22px;left:25px;right:25px}.topline .right{display:none}.brand{font-size:clamp(68px,26vw,112px)}.arabic{font-size:34px}.rings{width:120vw}.subtitle{font-size:9px;letter-spacing:.16em}.route-board{margin-top:19px;font-size:11px;padding:7px 11px;gap:9px}.taxi-check{top:64px;width:72vw}.skip,.meter{display:none}.loading{bottom:92px}.start{bottom:35px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.scene,.emblem{transform:none}.rain,.dust,.fog,.scan,.light-sweep,.road-light,.rings{display:none}}
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="OGRA game loading screen">
    <div class="scene"></div><div class="fog"></div><canvas class="rain" id="rain"></canvas><div class="scan"></div><div class="light-sweep"></div><div class="road-light"></div><canvas class="dust" id="dust"></canvas>
    <div class="hud"></div><div class="taxi-check"></div>
    <div class="topline"><span class="signal"><i></i>CAIRO TAXI + MICROBUS NETWORK</span><span class="right" id="clock">20:26:00 EET</span></div>
    <section class="main">
      <div class="emblem">
        <div class="rings"></div>
        <p class="kicker">Egyptian Taxi &amp; Microbus Simulator</p>
        <h1 class="brand" aria-label="OGRA"><span>O</span><span>G</span><span>R</span><span>A</span></h1>
        <div class="arabic" lang="ar" dir="rtl">أجرة</div><i class="tear" aria-hidden="true"></i>
        <div class="subtitle">Every fare carries a story</div>
        <div class="route-board" lang="ar" dir="rtl"><span>رمسيس</span><span class="arrow">◀</span><b>خط ٣١</b><span class="arrow">◀</span><span>العباسية</span></div>
      </div>
    </section>
    <div class="loading" id="loading"><div class="readout"><span id="status">INITIALIZING CITY</span><span id="percent">00%</span></div><div class="track"><div class="bar" id="bar"></div></div></div>
    <button class="start" id="start" type="button" aria-label="Tap to start OGRA">Tap to Start</button>
    <span class="meter"><i></i>METER READY · PICKUP MODE</span><span class="skip">SPACE / ENTER</span><div class="flash"></div><div class="curtain"></div>
  </main>
  <script>
    (()=>{
      const stage=document.querySelector('#stage'),bar=document.querySelector('#bar'),pct=document.querySelector('#percent'),status=document.querySelector('#status'),start=document.querySelector('#start');
      const phases=[[9,'WAKING THE CITY'],[23,'PAINTING THE STREETS'],[41,'CALLING THE DRIVERS'],[64,'MAPPING THE ROUTES'],[82,'LIGHTING THE NIGHT'],[100,'ROUTE READY']];let p=0,phase=0,ready=false;
      const load=setInterval(()=>{p=Math.min(100,p+Math.max(1,Math.round((100-p)*.055)));while(phase<phases.length-1&&p>=phases[phase][0])phase++;bar.style.width=p+'%';bar.style.setProperty('--p',p+'%');pct.textContent=String(p).padStart(2,'0')+'%';status.textContent=phases[phase][1];if(p===100){clearInterval(load);ready=true;setTimeout(()=>{document.querySelector('#loading').style.opacity='.25';start.classList.add('ready')},450)}},38);
      function tone(){try{const C=window.AudioContext||window.webkitAudioContext,a=new C(),g=a.createGain(),o=a.createOscillator();o.type='sine';o.frequency.setValueAtTime(90,a.currentTime);o.frequency.exponentialRampToValueAtTime(42,a.currentTime+.65);g.gain.setValueAtTime(.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.7);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.72)}catch(e){}}
      addEventListener('message',e=>{ if(e&&e.data==='ogra:game-ready'){ try{ ready=true;
  const st=document.getElementById('start'); if(st) st.classList.add('ready');
  const ld=document.querySelector('#loading'); if(ld) ld.style.opacity='.25'; }catch(err){} } });
function enter(){if(!ready||stage.classList.contains('entering'))return;tone();stage.classList.add('entering');setTimeout(()=>{window.dispatchEvent(new CustomEvent('ogra:start'));try{ if(parent!==window) parent.postMessage('ogra:splash-done','*'); }catch(e){}const next=stage.dataset.next;if(next)location.href=next;else{stage.classList.remove('entering');document.querySelector('.curtain').style.transform='scaleY(0)'}},1100)}
      start.addEventListener('click',enter);addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter')enter()});
      let touchX=0,touchY=0,lastTouch=-99999;
      addEventListener('pointermove',e=>{touchX=(e.clientX/innerWidth)-.5;touchY=(e.clientY/innerHeight)-.5;lastTouch=performance.now()},{passive:true});
      if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
        const ambient=t=>{const autoX=Math.sin(t*.00031)*.54+Math.sin(t*.00013)*.16,autoY=Math.cos(t*.00027)*.38+Math.sin(t*.00017)*.12;const influence=Math.max(0,1-(t-lastTouch)/1800);const x=autoX*(1-influence)+touchX*influence,y=autoY*(1-influence)+touchY*influence;document.documentElement.style.setProperty('--mx',x.toFixed(3));document.documentElement.style.setProperty('--my',y.toFixed(3));document.documentElement.style.setProperty('--pulse',((Math.sin(t*.0011)+1)/2).toFixed(3));requestAnimationFrame(ambient)};requestAnimationFrame(ambient)
      }
      const clock=document.querySelector('#clock');setInterval(()=>{clock.textContent=new Date().toLocaleTimeString('en-GB',{timeZone:'Africa/Cairo',hour12:false})+' EET'},1000);
      function layer(id,count,kind){const c=document.getElementById(id),x=c.getContext('2d');let W,H,d=[];function size(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;d=Array.from({length:count},()=>({x:Math.random()*W,y:Math.random()*H,l:(kind==='rain'?12+Math.random()*34:1+Math.random()*2)*devicePixelRatio,s:(kind==='rain'?8+Math.random()*13:.12+Math.random()*.42)*devicePixelRatio,a:.15+Math.random()*.45}))}function draw(){x.clearRect(0,0,W,H);for(const q of d){if(kind==='rain'){x.strokeStyle=`rgba(180,225,241,${q.a})`;x.lineWidth=.55*devicePixelRatio;x.beginPath();x.moveTo(q.x,q.y);x.lineTo(q.x-3*devicePixelRatio,q.y+q.l);x.stroke();q.y+=q.s;q.x-=q.s*.07;if(q.y>H){q.y=-q.l;q.x=Math.random()*W}}else{x.fillStyle=`rgba(255,191,100,${q.a})`;x.beginPath();x.arc(q.x,q.y,q.l,0,7);x.fill();q.y-=q.s;q.x+=Math.sin(q.y*.003)*.15;if(q.y<0){q.y=H;q.x=Math.random()*W}}}requestAnimationFrame(draw)}addEventListener('resize',size);size();draw()}
      if(!matchMedia('(prefers-reduced-motion: reduce)').matches){layer('rain',Math.min(170,Math.round(innerWidth/8)),'rain');layer('dust',34,'dust')}
    })();
  </script>
</body>
</html>
