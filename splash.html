<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OGRA</title>
<style>
  :root{--c1:#00e5ff;--c2:#ff2fb3;--c3:#ffb627;--bg0:#03040c;--bg1:#0a0f26}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg0);font-family:Cairo,system-ui,sans-serif;color:#eaf2ff}
  #sp{position:fixed;inset:0;display:grid;place-items:center;cursor:pointer;
      background:radial-gradient(120% 80% at 50% 8%,#16214a 0%,var(--bg1) 42%,var(--bg0) 100%)}
  .stars,.grid,.sun,.beam,.city,.road{position:absolute;inset:0;pointer-events:none}
  .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#cfe9ff;opacity:.7;
    animation:tw 3.5s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:.95;transform:scale(1.15)}}
  .sun{background:radial-gradient(circle at 50% 62%,rgba(255,47,179,.55),rgba(255,47,179,0) 38%);filter:blur(2px)}
  .sunDisc{position:absolute;left:50%;top:44%;width:min(46vw,340px);aspect-ratio:1;transform:translate(-50%,-50%);
    border-radius:50%;background:linear-gradient(180deg,#ffd36e,#ff2fb3 60%,#7a1bff);
    -webkit-mask:repeating-linear-gradient(180deg,#000 0 12px,transparent 12px 17px);
    mask:repeating-linear-gradient(180deg,#000 0 12px,transparent 12px 17px);
    filter:drop-shadow(0 0 40px rgba(255,47,179,.55));animation:rise 4s cubic-bezier(.2,.8,.3,1) both}
  @keyframes rise{from{transform:translate(-50%,10%);opacity:0}to{transform:translate(-50%,-50%);opacity:1}}
  .grid{top:58%;background:
    repeating-linear-gradient(90deg,rgba(0,229,255,.34) 0 2px,transparent 2px 84px),
    repeating-linear-gradient(0deg,rgba(0,229,255,.28) 0 2px,transparent 2px 46px);
    transform:perspective(420px) rotateX(74deg);transform-origin:top center;
    -webkit-mask:linear-gradient(180deg,#000,transparent 78%);mask:linear-gradient(180deg,#000,transparent 78%);
    animation:flow 2.4s linear infinite}
  @keyframes flow{to{background-position:0 46px,0 46px}}
  .city{bottom:33%;top:auto;height:26%;display:flex;align-items:flex-end;gap:6px;justify-content:center;opacity:.55}
  .city b{display:block;width:clamp(10px,2.4vw,26px);background:linear-gradient(180deg,#0d1b3d,#050a18);
    border-top:2px solid rgba(0,229,255,.55);box-shadow:0 0 18px rgba(0,229,255,.18)}
  .beam{background:conic-gradient(from 210deg at 50% 120%,transparent 0deg,rgba(0,229,255,.10) 18deg,transparent 40deg);
    animation:sweep 7s linear infinite}
  @keyframes sweep{to{transform:rotate(360deg)}}
  .wrap{position:relative;z-index:3;text-align:center;padding:20px}
  .logo{font:900 clamp(46px,12vw,120px)/1 Rajdhani,Cairo,sans-serif;letter-spacing:.08em;
    background:linear-gradient(90deg,#fff,var(--c1),#fff,var(--c3));background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(0,229,255,.45));animation:shine 6s linear infinite, pop .9s cubic-bezier(.2,1.2,.3,1) both}
  @keyframes shine{to{background-position:300% 0}}
  @keyframes pop{from{opacity:0;transform:translateY(18px) scale(.94);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
  .ar{font:800 clamp(20px,4.4vw,38px)/1 Cairo,sans-serif;color:#eaf2ff;margin-top:.15em;opacity:.92;
    animation:pop 1s .12s cubic-bezier(.2,1.2,.3,1) both}
  .tag{margin-top:.8em;color:#9fd7ff;font:700 clamp(12px,2.2vw,17px) Cairo,sans-serif;letter-spacing:.02em;
    animation:pop 1s .22s cubic-bezier(.2,1.2,.3,1) both}
  .barWrap{margin:22px auto 0;width:min(62vw,420px);height:10px;border-radius:99px;background:rgba(255,255,255,.08);
    box-shadow:inset 0 0 0 1px rgba(0,229,255,.35), 0 0 28px rgba(0,229,255,.12);overflow:hidden}
  .bar{height:100%;width:8%;border-radius:99px;background:linear-gradient(90deg,var(--c1),#fff,var(--c2));
    background-size:200% 100%;animation:bshine 1.4s linear infinite;transition:width .4s cubic-bezier(.3,.9,.3,1)}
  @keyframes bshine{to{background-position:-200% 0}}
  .pct{margin-top:.5em;color:#7fd8ff;font:800 13px Rajdhani,sans-serif;letter-spacing:.14em}
  .tap{margin-top:1.2em;color:#ffd98a;font:800 clamp(13px,2.4vw,18px) Cairo,sans-serif;opacity:0;animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
  .bus{position:absolute;bottom:26%;left:-30%;width:min(30vw,260px);z-index:2;filter:drop-shadow(0 0 22px rgba(0,229,255,.4));
    animation:drive 6s cubic-bezier(.35,0,.5,1) infinite}
  @keyframes drive{0%{left:-32%}70%{left:78%}100%{left:120%}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="sp">
  <div class="stars" id="stars"></div>
  <div class="sun"><div class="sunDisc"></div></div>
  <div class="beam"></div>
  <div class="city" id="city"></div>
  <div class="grid"></div>
  <svg class="bus" viewBox="0 0 220 90" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="8" y="18" width="190" height="46" rx="12" fill="#0e1c3f" stroke="#00e5ff" stroke-width="2"/>
    <rect x="20" y="26" width="52" height="20" rx="5" fill="#0a1430" stroke="#00e5ff" stroke-opacity=".7"/>
    <rect x="80" y="26" width="40" height="20" rx="5" fill="#0a1430" stroke="#00e5ff" stroke-opacity=".7"/>
    <rect x="128" y="26" width="40" height="20" rx="5" fill="#0a1430" stroke="#00e5ff" stroke-opacity=".7"/>
    <rect x="176" y="30" width="18" height="12" rx="3" fill="#ffb627"/>
    <circle cx="56" cy="68" r="12" fill="#050a18" stroke="#00e5ff" stroke-width="3"/>
    <circle cx="158" cy="68" r="12" fill="#050a18" stroke="#00e5ff" stroke-width="3"/>
  </svg>
  <div class="wrap">
    <div class="logo">OGRA</div>
    <div class="ar">أجرة</div>
    <div class="tag">شوارع مصر.. وإنت الأسطى</div>
    <div class="barWrap"><div class="bar" id="bar"></div></div>
    <div class="pct" id="pct">LOADING 8%</div>
    <div class="tap" id="tap">اضغط للبدء</div>
  </div>
</div>
<script>
  const st = document.getElementById('stars');
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('i');
    s.style.left = (Math.random()*100).toFixed(1) + '%';
    s.style.top = (Math.random()*58).toFixed(1) + '%';
    s.style.animationDelay = (Math.random()*3.5).toFixed(2) + 's';
    const k = (Math.random()*1.6 + 1).toFixed(1); s.style.width = s.style.height = k + 'px';
    st.appendChild(s);
  }
  const city = document.getElementById('city');
  for (let i = 0; i < 46; i++) {
    const b = document.createElement('b');
    b.style.height = (18 + Math.random()*82).toFixed(0) + '%';
    b.style.opacity = (0.45 + Math.random()*0.55).toFixed(2);
    city.appendChild(b);
  }
  let p = 8;
  const bar = document.getElementById('bar'), pct = document.getElementById('pct'), tap = document.getElementById('tap');
  const tick = setInterval(() => {
    p = Math.min(100, p + 4 + Math.random()*9);
    bar.style.width = p + '%';
    pct.textContent = 'LOADING ' + Math.round(p) + '%';
    if (p >= 100) { clearInterval(tick); pct.textContent = 'READY'; tap.style.animationName = 'blink'; tap.style.opacity = 1; }
  }, 180);
  function go(){ try { parent.postMessage('ogra_splash_done', '*'); } catch(e) {} }
  document.getElementById('sp').addEventListener('click', go);
  document.getElementById('sp').addEventListener('touchend', go, {passive:true});
  setTimeout(go, 9000);
</script>
</body>
</html>
